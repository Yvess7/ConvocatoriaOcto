<div
  id="contador-fase-widget"
  data-contador="hero-widget"
  class="relative w-full select-none will-change-transform flex flex-col items-center gap-6 sm:gap-7"
  role="region"
  aria-label="Cuenta regresiva del próximo evento"
>
  <!-- Etapa actual en grande -->
  <h2 class="text-center text-3xl sm:text-4xl lg:text-5xl text-white font-normal tracking-tight leading-tight drop-shadow-[0_3px_12px_rgba(0,0,0,0.3)]">
    {{ etapaTitulo }}
  </h2>

  <!-- Disco central: logo dentro de un anillo de progreso con figuras orbitando -->
  <div
    data-spaghetti-part="desktop-ring"
    class="relative w-40 h-40 sm:w-48 sm:h-48 lg:w-56 lg:h-56 will-change-transform"
    role="timer"
    [attr.aria-label]="contador.dias() + ' días restantes'"
  >
    <!-- Órbita con figuras geométricas -->
    <div class="pointer-events-none absolute -inset-3 sm:-inset-4 animate-spin-slow" aria-hidden="true">
      <div class="absolute top-0 left-1/2 -translate-x-1/2 w-4 h-4 sm:w-6 sm:h-6 bg-ink shape-diamond"></div>
      <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-4 h-4 sm:w-6 sm:h-6 bg-white shape-hexagon"></div>
      <div class="absolute left-0 top-1/2 -translate-y-1/2 w-4 h-4 sm:w-5 sm:h-5 bg-brand-red shape-triangle"></div>
      <div class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 sm:w-5 sm:h-5 bg-white shape-cross"></div>
    </div>

    <!-- Anillos SVG -->
    <svg viewBox="0 0 200 200" class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" aria-hidden="true">
      <circle cx="100" cy="100" r="97" fill="none" class="stroke-white/70 stroke-[0.6]" stroke-dasharray="1.5 3.5" />
      <circle cx="100" cy="100" r="90" fill="none" class="stroke-ink/25 stroke-[7]" />
      <circle
        cx="100"
        cy="100"
        r="90"
        fill="none"
        class="stroke-brand-red stroke-[7] transition-[stroke-dashoffset] duration-1000 ease-out"
        stroke-linecap="round"
        pathLength="100"
        stroke-dasharray="100"
        [style.stroke-dashoffset]="contador.progresoOffset()"
      />
    </svg>

    <!-- Disco blanco con el logo -->
    <div class="absolute inset-3 sm:inset-4 rounded-full bg-white shadow-2xl flex items-center justify-center">
      <img
        src="/images/logo-robotica-al-estilo-jalisco.webp"
        alt="Robótica al Estilo Jalisco"
        class="w-4/5 h-auto"
      />
    </div>
  </div>

  <!-- Cifras libres sobre el banner -->
  <div class="flex items-start justify-center gap-3 sm:gap-6 lg:gap-10">
      <div data-spaghetti-part="desktop-digits" class="text-center will-change-transform">
        <span class="block tabular-nums leading-none text-3xl sm:text-5xl lg:text-6xl text-white font-normal drop-shadow-[0_3px_12px_rgba(0,0,0,0.25)]">{{ contador.dias() }}</span>
        <span class="block mt-1.5 text-[9px] sm:text-xs uppercase tracking-[0.3em] text-white">{{ contador.etiquetaDias() }}</span>
      </div>
      <span class="self-center -mt-4 sm:-mt-5 w-px h-8 sm:h-12 bg-white/50" aria-hidden="true"></span>
      <div data-spaghetti-part="desktop-hms" class="text-center will-change-transform">
        <span class="block tabular-nums leading-none text-3xl sm:text-5xl lg:text-6xl text-white font-normal drop-shadow-[0_3px_12px_rgba(0,0,0,0.25)]">{{ contador.horas() }}</span>
        <span class="block mt-1.5 text-[9px] sm:text-xs uppercase tracking-[0.3em] text-white">Horas</span>
      </div>
      <span class="self-center -mt-4 sm:-mt-5 w-px h-8 sm:h-12 bg-white/50" aria-hidden="true"></span>
      <div data-spaghetti-part="desktop-hms" class="text-center will-change-transform">
        <span class="block tabular-nums leading-none text-3xl sm:text-5xl lg:text-6xl text-white font-normal drop-shadow-[0_3px_12px_rgba(0,0,0,0.25)]">{{ contador.minutos() }}</span>
        <span class="block mt-1.5 text-[9px] sm:text-xs uppercase tracking-[0.3em] text-white">Min</span>
      </div>
      <span class="self-center -mt-4 sm:-mt-5 w-px h-8 sm:h-12 bg-white/50" aria-hidden="true"></span>
      <div data-spaghetti-part="desktop-hms" class="text-center will-change-transform">
        <span class="block tabular-nums leading-none text-3xl sm:text-5xl lg:text-6xl text-white font-normal drop-shadow-[0_3px_12px_rgba(0,0,0,0.25)]">{{ contador.segundos() }}</span>
        <span class="block mt-1.5 text-[9px] sm:text-xs uppercase tracking-[0.3em] text-white">Seg</span>
      </div>
  </div>

  <!-- Fase y subtítulo -->
  <div data-spaghetti-part="desktop-badge" class="text-center will-change-transform">
    <span class="inline-block px-3 py-1.5 rounded-md bg-brand-red text-white text-[11px] sm:text-xs tracking-[0.28em] uppercase leading-none">
      {{ contador.etiquetaEvento() }} · {{ contador.fase() }}
    </span>
  </div>

  @if (contador.aviso()) {
    <p class="text-xs text-white italic text-center" role="status">{{ contador.aviso() }}</p>
  }
</div>
