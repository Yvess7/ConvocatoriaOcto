<div
  id="contador-fase-docked"
  data-contador="docked-widget"
  class="fixed bottom-3 right-3 sm:bottom-4 sm:right-4 2xl:bottom-6 2xl:right-6 z-40 select-none will-change-transform"
  [class.pointer-events-auto]="progreso() > 0.8"
  [class.pointer-events-none]="progreso() <= 0.8"
  [style.opacity]="shellProgress()"
  [style.transform]="capsuleTransform()"
  role="complementary"
  aria-label="Contador de tiempo del torneo"
>
  @if (!colapsado()) {
    <!-- Tarjeta editorial institucional acoplada con marco desplazado y bloques cuadrados -->
    <div
      data-docked-target="capsule"
      class="group relative flex items-center gap-2.5 xl:gap-3 p-2 xl:p-2.5 2xl:p-3 rounded-lg xl:rounded-xl bg-white border-2 border-brand-orange text-ink transition-all duration-300"
      [style.box-shadow]="forjandoActivo() ? '5px 5px 0 0 #f6842b, 0 0 24px rgba(246,132,43,0.4)' : '5px 5px 0 0 #f6842b, 0 10px 22px rgba(0,0,0,0.14)'"
    >
      <!-- Bloque Izquierdo: Cuadro Naranja con Anillo SVG blanco y Días restantes -->
      <div
        data-docked-target="ring"
        class="relative w-12 h-12 xl:w-14 xl:h-14 2xl:w-16 2xl:h-16 rounded-lg bg-brand-orange text-white flex items-center justify-center shrink-0 shadow-xs overflow-hidden"
      >
        <svg viewBox="0 0 100 100" class="relative z-10 w-10 h-10 xl:w-12 xl:h-12 2xl:w-14 2xl:h-14 -rotate-90 pointer-events-none" aria-hidden="true">
          <circle
            cx="50"
            cy="50"
            r="42"
            fill="none"
            class="stroke-white/25 stroke-[4]"
            [style.opacity]="ringProgress()"
          />
          <circle
            cx="50"
            cy="50"
            r="42"
            fill="none"
            stroke="#ffffff"
            stroke-width="6"
            stroke-linecap="round"
            pathLength="100"
            stroke-dasharray="100"
            [style.stroke-dashoffset]="ringOffsetDinamico()"
          />
        </svg>
        <div
          class="absolute inset-0 z-10 flex flex-col items-center justify-center will-change-transform"
          [style.opacity]="daysProgress()"
          [style.transform]="'scale(' + (0.4 + 0.6 * daysProgress()) + ')'"
        >
          <span class="text-base xl:text-lg 2xl:text-xl font-bold text-white tabular-nums leading-none">
            {{ contador.dias() }}
          </span>
          <span class="text-[7px] xl:text-[8px] 2xl:text-[9px] font-bold tracking-widest text-white/90 uppercase leading-none mt-0.5">
            {{ contador.etiquetaDias() }}
          </span>
        </div>
      </div>

      <!-- Bloque Central: Fase y Reloj Digital en Módulos Cuadrados H / M / S -->
      <div class="flex flex-col pr-1 min-w-0">
        <div
          class="flex flex-col mb-1 xl:mb-1.5 will-change-transform"
          [style.opacity]="phaseProgress()"
          [style.transform]="'translateX(' + ((1 - phaseProgress()) * -10) + 'px)'"
        >
          <span class="inline-flex items-center gap-1.5 text-[9px] xl:text-[10px] font-bold tracking-[0.18em] text-ink/75 uppercase leading-none">
            <span class="relative flex w-1.5 h-1.5" aria-hidden="true">
              <span class="absolute inline-flex w-full h-full rounded-full bg-brand-orange animate-ping"></span>
              <span class="relative inline-flex w-1.5 h-1.5 rounded-full bg-brand-orange"></span>
            </span>
            {{ contador.etiquetaEvento() }}
          </span>
          <span class="text-xs xl:text-sm 2xl:text-base text-brand-orange font-bold leading-tight mt-0.5 truncate max-w-36 xl:max-w-44 2xl:max-w-52">
            {{ contador.fase() }}
          </span>
        </div>

        <div class="flex items-center gap-1 text-xs xl:text-sm font-bold tabular-nums leading-none">
          <span
            class="px-1.5 py-1 xl:px-2 xl:py-1 rounded-md bg-orange-50 border border-brand-orange/30 text-ink will-change-transform inline-flex items-baseline"
            [style.opacity]="hProgress()"
            [style.transform]="'translateY(' + ((1 - hProgress()) * -8) + 'px) scale(' + (0.6 + 0.4 * hProgress()) + ')'"
          >{{ contador.horas() }}<small class="text-[8px] xl:text-[9px] font-bold text-brand-orange ml-0.5">H</small></span>
          <span class="text-ink/40 font-normal" [style.opacity]="hProgress()">:</span>
          <span
            class="px-1.5 py-1 xl:px-2 xl:py-1 rounded-md bg-orange-50 border border-brand-orange/30 text-ink will-change-transform inline-flex items-baseline"
            [style.opacity]="mProgress()"
            [style.transform]="'translateY(' + ((1 - mProgress()) * -8) + 'px) scale(' + (0.6 + 0.4 * mProgress()) + ')'"
          >{{ contador.minutos() }}<small class="text-[8px] xl:text-[9px] font-bold text-brand-orange ml-0.5">M</small></span>
          <span class="text-ink/40 font-normal" [style.opacity]="mProgress()">:</span>
          <span
            class="px-1.5 py-1 xl:px-2 xl:py-1 rounded-md bg-brand-orange text-white will-change-transform inline-flex items-baseline shadow-2xs"
            [style.opacity]="sProgress()"
            [style.transform]="'translateY(' + ((1 - sProgress()) * -8) + 'px) scale(' + (0.6 + 0.4 * sProgress()) + ')'"
          >
            @for (s of [contador.segundos()]; track s) {
              <span class="animate-cifra-tick">{{ s }}</span>
            }
            <small class="text-[8px] xl:text-[9px] font-bold text-white/90 ml-0.5">S</small>
          </span>
        </div>
      </div>

      <!-- Control tipográfico limpio para minimizar (sin iconos SVG) -->
      <div
        class="flex items-center border-l border-gray-200 pl-2 shrink-0 self-stretch"
        [style.opacity]="sProgress()"
      >
        <button
          type="button"
          (click)="alternarColapso()"
          class="px-1.5 py-1 xl:px-2 xl:py-1 rounded-md bg-orange-50 text-brand-orange hover:bg-brand-orange hover:text-white text-xs font-normal transition-colors cursor-pointer self-center"
          title="Minimizar contador"
          aria-label="Minimizar contador"
        >
          —
        </button>
      </div>
    </div>
  } @else {
    <!-- Tarjeta cuadrada compacta con marco desplazado cuando el usuario minimiza el contador -->
    <button
      type="button"
      data-docked-target="capsule"
      (click)="alternarColapso()"
      class="group relative rounded-xl bg-white border-2 border-brand-orange p-1.5 shadow-[5px_5px_0_0_#f6842b,0_10px_24px_rgba(0,0,0,0.16)] hover:-translate-y-0.5 active:translate-y-0 transition-transform duration-300 cursor-pointer"
      title="Expandir contador"
      aria-label="Expandir contador"
    >
      <div class="relative w-11 h-11 xl:w-12 xl:h-12 2xl:w-14 2xl:h-14 rounded-lg bg-brand-orange text-white flex flex-col items-center justify-center overflow-hidden">
        <svg viewBox="0 0 100 100" class="relative z-10 w-9 h-9 xl:w-10 xl:h-10 2xl:w-12 2xl:h-12 -rotate-90 pointer-events-none" aria-hidden="true">
          <circle cx="50" cy="50" r="42" fill="none" class="stroke-white/25 stroke-[4]" />
          <circle
            cx="50"
            cy="50"
            r="42"
            fill="none"
            stroke="#ffffff"
            stroke-width="6"
            stroke-linecap="round"
            pathLength="100"
            stroke-dasharray="100"
            [style.stroke-dashoffset]="ringOffsetDinamico()"
          />
        </svg>
        <div class="absolute inset-0 z-10 flex flex-col items-center justify-center leading-none">
          <span class="text-xs xl:text-sm 2xl:text-base font-bold text-white tabular-nums">{{ contador.dias() }}</span>
          <span class="text-[7px] xl:text-[8px] font-bold tracking-wider text-white/90 uppercase mt-0.5">{{ contador.etiquetaDias() }}</span>
        </div>
      </div>
    </button>
  }
</div>
