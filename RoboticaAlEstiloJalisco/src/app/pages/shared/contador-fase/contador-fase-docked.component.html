<div
  id="contador-fase-docked"
  data-contador="docked-widget"
  class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-40 select-none will-change-transform"
  [class.pointer-events-auto]="progreso() > 0.8"
  [class.pointer-events-none]="progreso() <= 0.8"
  [style.opacity]="shellProgress()"
  role="complementary"
  aria-label="Contador de tiempo del torneo"
>
  @if (!colapsado()) {
    <!-- Versión compacta estándar que se forja pieza por pieza en tiempo real -->
    <div
      data-docked-target="capsule"
      class="group relative flex items-center gap-3.5 pl-3.5 pr-2.5 py-2.5 rounded-2xl bg-neutral-950/90 backdrop-blur-xl border text-white transition-colors duration-300"
      [class.border-brand-orange]="forjandoActivo()"
      [class.border-white/20]="!forjandoActivo()"
      [class.hover:border-brand-orange/60]="!forjandoActivo()"
      [style.clip-path]="progreso() >= 0.98 ? 'none' : 'circle(' + (shellProgress() * 145) + '% at 28px 50%)'"
      [style.box-shadow]="forjandoActivo() ? '0 0 28px rgba(246,132,43,0.55), 0 12px 36px rgba(0,0,0,0.45)' : '0 12px 36px rgba(0,0,0,0.45)'"
    >
      <!-- Mini Anillo SVG con Días restantes -->
      <div
        data-docked-target="ring"
        class="relative w-12 h-12 flex items-center justify-center shrink-0"
      >
        <svg viewBox="0 0 100 100" class="w-full h-full -rotate-90 pointer-events-none" aria-hidden="true">
          <!-- Fondo del anillo -->
          <circle
            cx="50"
            cy="50"
            r="44"
            fill="none"
            class="stroke-white/15 stroke-6"
            [style.opacity]="ringProgress()"
          />
          <!-- Progreso dinámico en naranja que se teje con las hebras de espagueti -->
          <circle
            cx="50"
            cy="50"
            r="44"
            fill="none"
            stroke="#f6842b"
            stroke-width="7"
            stroke-linecap="round"
            pathLength="100"
            stroke-dasharray="100"
            [style.stroke-dashoffset]="ringOffsetDinamico()"
          />
        </svg>
        <div
          class="absolute inset-0 flex flex-col items-center justify-center will-change-transform"
          [style.opacity]="daysProgress()"
          [style.transform]="'scale(' + (0.4 + 0.6 * daysProgress()) + ')'"
        >
          <span class="text-sm font-bold text-white tabular-nums leading-none">
            {{ contador.dias() }}
          </span>
          <span class="text-[8px] font-normal tracking-widest text-white/70 uppercase leading-none mt-0.5">
            DÍAS
          </span>
        </div>
      </div>

      <!-- Datos de la Fase y Reloj Digital que cristalizan de izquierda a derecha -->
      <div class="flex flex-col pr-2">
        <span
          class="text-[10px] font-normal tracking-widest text-brand-orange uppercase leading-none mb-1 will-change-transform"
          [style.opacity]="phaseProgress()"
          [style.transform]="'translateX(' + ((1 - phaseProgress()) * -10) + 'px)'"
        >
          {{ contador.fase() }}
        </span>
        <div class="flex items-center gap-1.5 text-sm sm:text-base font-bold text-white tabular-nums tracking-wider leading-none">
          <span
            class="will-change-transform inline-block"
            [style.opacity]="hProgress()"
            [style.transform]="'translateY(' + ((1 - hProgress()) * -8) + 'px) scale(' + (0.6 + 0.4 * hProgress()) + ')'"
          >{{ contador.horas() }}<small class="text-[9px] font-normal text-white/70 ml-0.5">H</small></span>
          <span class="text-white/40" [style.opacity]="hProgress()">:</span>
          <span
            class="will-change-transform inline-block"
            [style.opacity]="mProgress()"
            [style.transform]="'translateY(' + ((1 - mProgress()) * -8) + 'px) scale(' + (0.6 + 0.4 * mProgress()) + ')'"
          >{{ contador.minutos() }}<small class="text-[9px] font-normal text-white/70 ml-0.5">M</small></span>
          <span class="text-white/40" [style.opacity]="mProgress()">:</span>
          <span
            class="text-brand-orange will-change-transform inline-block"
            [style.opacity]="sProgress()"
            [style.transform]="'translateY(' + ((1 - sProgress()) * -8) + 'px) scale(' + (0.6 + 0.4 * sProgress()) + ')'"
          >{{ contador.segundos() }}<small class="text-[9px] font-normal text-white/70 ml-0.5">S</small></span>
        </div>
      </div>

      <!-- Botón de colapsar / minimizar -->
      <div
        class="flex items-center border-l border-white/15 pl-1.5 shrink-0"
        [style.opacity]="sProgress()"
      >
        <button
          type="button"
          (click)="alternarColapso()"
          class="p-1.5 rounded-lg text-white/50 hover:text-white hover:bg-white/10 transition-colors cursor-pointer"
          title="Minimizar contador"
          aria-label="Minimizar contador"
        >
          <svg class="w-3.5 h-3.5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </button>
      </div>
    </div>
  } @else {
    <!-- Burbuja ultra-compacta cuando el usuario prefiere minimizarlo -->
    <button
      type="button"
      data-docked-target="capsule"
      (click)="alternarColapso()"
      class="group relative w-12 h-12 flex items-center justify-center rounded-full bg-neutral-950/90 backdrop-blur-xl border border-white/20 shadow-[0_8px_30px_rgba(0,0,0,0.5)] hover:border-brand-orange hover:scale-105 active:scale-95 transition-all duration-300 cursor-pointer"
      title="Expandir contador"
      aria-label="Expandir contador"
    >
      <svg viewBox="0 0 100 100" class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none" aria-hidden="true">
        <circle cx="50" cy="50" r="44" fill="none" class="stroke-white/15 stroke-6" />
        <circle
          cx="50"
          cy="50"
          r="44"
          fill="none"
          stroke="#f6842b"
          stroke-width="7"
          stroke-linecap="round"
          pathLength="100"
          stroke-dasharray="100"
          [style.stroke-dashoffset]="ringOffsetDinamico()"
        />
      </svg>
      <div class="flex flex-col items-center justify-center leading-none">
        <span class="text-xs font-bold text-white tabular-nums">{{ contador.dias() }}</span>
        <span class="text-[7px] text-white/70 uppercase">D</span>
      </div>
    </button>
  }
</div>
