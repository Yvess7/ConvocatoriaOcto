<!-- Barra de navegación fija con franja naranja -->
<header class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-sm shadow-xs">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <nav class="flex items-center justify-between h-20" aria-label="Navegación principal">
      <!-- Logo / Inicio -->
      <a
        href="#"
        (click)="closeMenu()"
        class="flex items-center text-ink transition-opacity hover:opacity-90"
        aria-label="Inicio"
      >
        <span class="text-xl sm:text-2xl text-ink font-normal tracking-tight">
          Robótica al Estilo Jalisco
        </span>
      </a>

      <!-- Navegación de escritorio (derecha) -->
      <div class="hidden md:flex items-center gap-8">
        <a
          href="#torneos"
          class="text-base text-ink hover:text-brand-orange transition-colors font-normal"
        >
          Torneos
        </a>
        <a
          href="#documentacion"
          class="text-base text-ink hover:text-brand-orange transition-colors font-normal"
        >
          Documentación
        </a>
        <a
          href="#videos"
          class="text-base text-ink hover:text-brand-orange transition-colors font-normal"
        >
          Videos
        </a>
        <a
          href="#contacto"
          class="px-5 py-2.5 rounded-md bg-brand-red text-white hover:bg-brand-red-dark transition-colors font-normal shadow-xs inline-flex items-center justify-center"
        >
          Contacto
        </a>
      </div>

      <!-- Botón menú móvil -->
      <div class="flex md:hidden">
        <button
          type="button"
          (click)="toggleMenu()"
          class="p-2 rounded-lg text-ink hover:text-brand-red focus:outline-hidden"
          [attr.aria-expanded]="isMenuOpen()"
          aria-label="Abrir menú de navegación"
        >
          @if (!isMenuOpen()) {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          } @else {
            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          }
        </button>
      </div>
    </nav>
  </div>

  <!-- Franja naranja moderna debajo de la barra -->
  <div class="h-1 w-full bg-brand-orange"></div>

  <!-- Menú desplegable para móviles -->
  @if (isMenuOpen()) {
    <div class="md:hidden border-t border-gray-100 bg-white px-4 pt-3 pb-6 space-y-3">
      <a
        href="#torneos"
        (click)="closeMenu()"
        class="block px-3 py-2 rounded-lg text-base text-ink hover:bg-orange-50 hover:text-brand-orange transition-colors font-normal"
      >
        Torneos
      </a>
      <a
        href="#documentacion"
        (click)="closeMenu()"
        class="block px-3 py-2 rounded-lg text-base text-ink hover:bg-orange-50 hover:text-brand-orange transition-colors font-normal"
      >
        Documentación
      </a>
      <a
        href="#videos"
        (click)="closeMenu()"
        class="block px-3 py-2 rounded-lg text-base text-ink hover:bg-orange-50 hover:text-brand-orange transition-colors font-normal"
      >
        Videos
      </a>
      <div class="pt-2">
        <a
          href="#contacto"
          (click)="closeMenu()"
          class="block w-full text-center px-5 py-3 rounded-md bg-brand-red text-white hover:bg-brand-red-dark transition-colors font-normal shadow-xs"
        >
          Contacto
        </a>
      </div>
    </div>
  }
</header>

<!-- Contenido principal con compensación por la barra fija -->
<main class="pt-21">
  <!-- Banner Hero de inicio que abarca de lado a lado -->
  <section id="inicio" class="relative w-full overflow-hidden bg-gray-900">
    <!-- Altura responsiva definida en escala Tailwind -->
    <div class="relative w-full h-80 sm:h-96 md:h-128 lg:h-144">
      <!-- Imagen de fondo de lado a lado -->
      <img
        src="/images/hero-banner.jpg"
        alt="Instalaciones Convocatoria Robótica al Estilo Jalisco"
        class="w-full h-full object-cover object-center select-none"
      />

      <!-- Filtro naranja transparente sobre la imagen -->
      <div class="absolute inset-0 bg-brand-orange/35 mix-blend-multiply pointer-events-none"></div>
      <div class="absolute inset-0 bg-brand-orange/20 pointer-events-none"></div>
    </div>
  </section>

  <!-- Secciones adicionales de la landing (Torneos, Documentación, Videos, Contacto) -->
  <section id="torneos" class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-2xl mx-auto mb-12">
      <span class="text-xs text-brand-orange uppercase tracking-wider font-normal">Categorías y Competencias</span>
      <h2 class="text-3xl text-ink font-normal tracking-tight mt-1">Torneos</h2>
      <p class="text-base text-ink/80 mt-2 font-normal">Descubre las modalidades y desafíos preparados para esta edición.</p>
    </div>
  </section>
</main>
